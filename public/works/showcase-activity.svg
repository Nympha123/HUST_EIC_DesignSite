<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Department activity showcase</title>
  <desc id="desc">A polished activity showcase image with event photos, badges, and project cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.48" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#dbeafe" stop-opacity="0.76"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1290" cy="160" r="210" fill="#38bdf8" opacity="0.24"/>
  <circle cx="1160" cy="720" r="270" fill="#34d399" opacity="0.18"/>
  <path d="M0 700 C220 620 300 780 520 700 C800 596 940 580 1140 640 C1320 694 1440 600 1600 520 L1600 900 L0 900 Z" fill="#020617" opacity="0.28"/>

  <g filter="url(#shadow)">
    <rect x="760" y="145" width="580" height="365" rx="36" fill="url(#card)"/>
    <rect x="805" y="205" width="205" height="135" rx="22" fill="#bfdbfe"/>
    <rect x="1038" y="205" width="255" height="135" rx="22" fill="#99f6e4"/>
    <rect x="805" y="370" width="488" height="34" rx="17" fill="#1e293b" opacity="0.22"/>
    <rect x="805" y="425" width="350" height="24" rx="12" fill="#1e293b" opacity="0.16"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="950" y="540" width="360" height="185" rx="30" fill="#ffffff" opacity="0.92"/>
    <rect x="990" y="590" width="205" height="18" rx="9" fill="#2563eb" opacity="0.82"/>
    <rect x="990" y="632" width="270" height="16" rx="8" fill="#475569" opacity="0.24"/>
    <rect x="990" y="670" width="220" height="16" rx="8" fill="#475569" opacity="0.18"/>
  </g>

  <g transform="translate(545 540) rotate(-8)" filter="url(#shadow)">
    <rect width="300" height="210" rx="28" fill="#f8fafc"/>
    <rect x="26" y="26" width="248" height="112" rx="18" fill="#fde68a"/>
    <circle cx="82" cy="82" r="30" fill="#f97316" opacity="0.75"/>
    <rect x="46" y="164" width="160" height="15" rx="7.5" fill="#334155" opacity="0.26"/>
  </g>

  <g fill="#ffffff" opacity="0.9">
    <text x="790" y="285" font-family="Arial, sans-serif" font-size="46" font-weight="700">ACTIVITY</text>
    <text x="790" y="335" font-family="Arial, sans-serif" font-size="24" font-weight="600" opacity="0.72">Highlights and team moments</text>
  </g>
</svg>
