<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Department design showcase</title>
  <desc id="desc">A visual layout of department posters, color swatches, and design assets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.45" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="1020" y="80" width="420" height="420" rx="90" fill="#f0abfc" opacity="0.2"/>
  <rect x="108" y="610" width="470" height="180" rx="90" fill="#38bdf8" opacity="0.18"/>
  <path d="M0 670 C260 530 520 810 770 640 C1010 478 1240 612 1600 458 L1600 900 L0 900 Z" fill="#020617" opacity="0.26"/>

  <g transform="translate(760 128) rotate(5)" filter="url(#shadow)">
    <rect width="370" height="520" rx="34" fill="#f8fafc"/>
    <rect x="32" y="36" width="306" height="206" rx="24" fill="#c4b5fd"/>
    <rect x="32" y="275" width="230" height="22" rx="11" fill="#312e81" opacity="0.82"/>
    <rect x="32" y="330" width="286" height="16" rx="8" fill="#475569" opacity="0.24"/>
    <rect x="32" y="370" width="250" height="16" rx="8" fill="#475569" opacity="0.18"/>
    <rect x="32" y="430" width="130" height="42" rx="21" fill="#4f46e5"/>
  </g>

  <g transform="translate(1080 230) rotate(-8)" filter="url(#shadow)">
    <rect width="310" height="440" rx="32" fill="#ffffff" opacity="0.95"/>
    <rect x="28" y="34" width="254" height="160" rx="24" fill="#f9a8d4"/>
    <circle cx="94" cy="114" r="40" fill="#be185d" opacity="0.76"/>
    <rect x="28" y="232" width="210" height="20" rx="10" fill="#111827" opacity="0.74"/>
    <rect x="28" y="286" width="246" height="16" rx="8" fill="#475569" opacity="0.2"/>
    <rect x="28" y="326" width="188" height="16" rx="8" fill="#475569" opacity="0.16"/>
  </g>

  <g transform="translate(590 585)" filter="url(#shadow)">
    <rect width="410" height="150" rx="32" fill="#ffffff" opacity="0.93"/>
    <circle cx="70" cy="75" r="34" fill="#2563eb"/>
    <circle cx="145" cy="75" r="34" fill="#14b8a6"/>
    <circle cx="220" cy="75" r="34" fill="#ec4899"/>
    <rect x="285" y="54" width="78" height="42" rx="21" fill="#111827" opacity="0.78"/>
  </g>

  <g fill="#ffffff" opacity="0.95">
    <text x="770" y="292" font-family="Arial, sans-serif" font-size="44" font-weight="700">DESIGN</text>
    <text x="770" y="342" font-family="Arial, sans-serif" font-size="24" font-weight="600" opacity="0.72">Posters, covers, and templates</text>
  </g>
</svg>
