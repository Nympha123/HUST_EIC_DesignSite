<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Department archive showcase</title>
  <desc id="desc">A clean archive dashboard image with folders, document cards, and status labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="0.52" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1140" cy="180" r="230" fill="#67e8f9" opacity="0.18"/>
  <circle cx="1320" cy="710" r="250" fill="#a7f3d0" opacity="0.16"/>
  <path d="M0 636 C245 565 355 740 575 652 C840 546 1038 578 1260 640 C1418 684 1510 640 1600 602 L1600 900 L0 900 Z" fill="#020617" opacity="0.24"/>

  <g transform="translate(790 180)" filter="url(#shadow)">
    <path d="M28 66 C28 43 47 24 70 24 H222 C242 24 252 54 272 54 H528 C552 54 572 74 572 98 V392 C572 418 551 440 524 440 H76 C49 440 28 418 28 392 Z" fill="url(#folder)"/>
    <rect x="74" y="116" width="452" height="270" rx="26" fill="#fffbeb" opacity="0.92"/>
    <rect x="112" y="166" width="210" height="22" rx="11" fill="#92400e" opacity="0.7"/>
    <rect x="112" y="226" width="350" height="17" rx="8.5" fill="#92400e" opacity="0.2"/>
    <rect x="112" y="276" width="304" height="17" rx="8.5" fill="#92400e" opacity="0.18"/>
    <rect x="112" y="326" width="170" height="42" rx="21" fill="#0f766e" opacity="0.9"/>
  </g>

  <g transform="translate(560 525)" filter="url(#shadow)">
    <rect width="360" height="185" rx="30" fill="#ffffff" opacity="0.94"/>
    <rect x="36" y="42" width="120" height="18" rx="9" fill="#059669" opacity="0.85"/>
    <rect x="36" y="88" width="275" height="16" rx="8" fill="#475569" opacity="0.23"/>
    <rect x="36" y="126" width="218" height="16" rx="8" fill="#475569" opacity="0.17"/>
  </g>

  <g transform="translate(1030 585)" filter="url(#shadow)">
    <rect width="310" height="145" rx="28" fill="#ecfeff" opacity="0.95"/>
    <rect x="34" y="40" width="96" height="20" rx="10" fill="#0891b2" opacity="0.78"/>
    <rect x="34" y="84" width="230" height="16" rx="8" fill="#475569" opacity="0.21"/>
