  <g fill="#ffffff" opacity="0.95">
    <text x="872" y="320" font-family="Arial, sans-serif" font-size="44" font-weight="700">ARCHIVE</text>
    <text x="872" y="370" font-family="Arial, sans-serif" font-size="24" font-weight="600" opacity="0.72">Tasks, files, and outcomes</text>
